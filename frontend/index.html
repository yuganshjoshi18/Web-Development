<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07130f" />
    <meta
      name="description"
      content="Northwind Studio — a wilderness-inspired workspace with a glassmorphism login and team directory."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/images/forest-day.jpg" />
    <title>Northwind — Studio workspace</title>
    <script>
      // Apply the saved theme before React paints to avoid a colour flash.
      try {
        var savedTheme = localStorage.getItem('northwind.theme');
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
